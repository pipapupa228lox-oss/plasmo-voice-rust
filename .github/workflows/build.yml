name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # libopus' CMakeLists still says cmake_minimum_required(VERSION 3.x), which
  # CMake 4 refuses unless this says otherwise.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # No Minecraft install and no sound card: the tests use real UDP sockets
      # and a mock server, so they run on a bare runner.
      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  release:
    name: release (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # cpal links ALSA on Linux; the default features do not need it, the
      # `device` feature does.
      - name: ALSA headers for cpal
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build the libraries
        run: cargo build --release --locked -p pv-proto -p pv-server

      - name: build the client with the audio devices
        run: cargo build --release --locked -p pv-client --features device

      - name: build the key utility
        run: cargo build --release --locked -p pv-client --features device --example dump_key

      - name: collect
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "${RUNNER_OS}" = "Windows" ] && exe=".exe"
          stage="dist/pv-voice-${{ matrix.name }}"
          mkdir -p "${stage}/bin" "${stage}/lib"
          cp "target/release/examples/dump_key${exe}" "${stage}/bin/"
          for crate in pv_proto pv_client pv_server; do
            cp "target/release/lib${crate}.rlib" "${stage}/lib/"
          done
          cp LICENSE README.md "${stage}/"

      - uses: actions/upload-artifact@v4
        with:
          name: pv-voice-${{ matrix.name }}
          path: dist/pv-voice-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 90
